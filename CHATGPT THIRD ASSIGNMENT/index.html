<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LUGX Gaming</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

        <header class="header">
        <div class="container nav">
            <a href="#" class="logo">
                <span><img src="New Project.png" alt="Logo"></span>
            </a>

            <nav class="menu">
                <a href="#" class="active">Home</a>
                <a href="#">Our Shop</a>
                <a href="#">Product Details</a>
                <a href="#">Contact Us</a>
                <a href="#" class="sign-in">SIGN IN</a>
            </nav>
        </div>
    </header>

    <!-- Hero Section -->
    <main class="hero">
        <div class="container hero-content">

            <!-- Left side -->
            <div class="hero-text">
                <p class="small-title">WELCOME TO LUGX</p>

                <h1>BEST <span>GAMING</span> SITE EVER!</h1>

                <p class="description">
                    LUGX Gaming is free Bootstrap 5 HTML CSS website template for your gaming websites.
                    You can download and use this layout for commercial purposes.
                    Please tell your friends about TemplateMo.
                </p>

                <div class="search-box">
                    <input type="text" placeholder="Type something">
                    <button>SEARCH NOW</button>
                </div>
            </div>

            <!-- Right side -->
            <div class="game-card">
                <img src="images/game-character.jpg" alt="Game character">

                <div class="price">$22</div>
                <div class="discount">-40%</div>
            </div>

        </div>
    </main>

</html>
